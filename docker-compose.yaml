# SatelliteAgent — full service compose (app + model servers + SimSat).
#
# The app server is containerized as the `app-server` service and is
# published on http://localhost:${APP_PORT:-7860}.
# This compose file manages app-server, SimSat, and the GPU model
# services together.
#
# Required env vars (set in .env at repo root, or export inline):
#
#   WILDFIRE_MODEL_DIR    Host path containing {base,adapter} subdirs of
#                         the LFM2.5-VL-450M wildfire LoRA staging.
#                         Default: ./models/wildfire-staging
#                         (You can mirror it from huggingface:
#                          LiquidAI/LFM2.5-VL-450M  → models/wildfire-staging/base
#                          YujiYamaguchi/lfm2-5-vl-450m-wildfire → models/wildfire-staging/adapter)
#
#   WILDFIRE_PRECURSOR_BASE_DIR
#                         Host path to the LFM2.5-VL-450M base dir for the
#                         precursor service. Default points back at
#                         WILDFIRE_MODEL_DIR's base subdir so the base is
#                         only mounted, not duplicated:
#                         Default: ./models/wildfire-staging/base
#
#   WILDFIRE_PRECURSOR_ADAPTER_DIR
#                         Host path to the wildfire-precursor LoRA adapter
#                         (YujiYamaguchi/lfm2-5-vl-450m-wildfire-precursor-pair14_7).
#                         Default: ./models/wildfire-precursor-staging/adapter
#
#   LFM2_AGENT_MODEL_DIR  Host path to the LFM2.5-VL-450M-sft-grpo
#                         checkpoint.
#                         Default: ./models/LFM2.5-VL-450M-sft-grpo
#
#   HF_CACHE_DIR          Optional. HuggingFace cache passthrough so the
#                         container reuses already-downloaded weights.
#                         Default: ~/.cache/huggingface
#
# Quickstart:
#
#   docker compose up -d        # builds + starts all services incl. SimSat
#   docker compose logs -f      # tail logs
#   docker compose down         # stop and remove containers
#
# Then open http://localhost:${APP_PORT:-7860}
#
# SimSat (port 9005) is included by default in this compose file.
# It is built from vendor/SimSat (cloned + patched by setup.sh).
# If you prefer a remote SimSat, set SIMSAT_API_URL in .env and the
# app-server will use it instead — simsat service startup is still
# harmless in that case (it just won't be called).
# To skip SimSat entirely: docker compose up -d --scale simsat=0
#
# All services attach to the user-defined bridge network `world-observer`,
# so each service is reachable from the others by its compose service name
# (e.g. http://lfm2-agent:8000, http://simsat:8000).

networks:
  world-observer:
    driver: bridge
    name: world-observer

services:
  # ------------------------------------------------------------------
  # SimSat — Sentinel-2 mock backend (port 9005)
  # Built from vendor/SimSat (run `WITH_SIMSAT=1 ./setup.sh` first).
  # ------------------------------------------------------------------
  simsat:
    build:
      context: vendor/SimSat
      dockerfile: Dockerfile.sim
    image: worldobserver/simsat:latest
    container_name: world-observer-simsat
    restart: unless-stopped
    networks: [world-observer]
    ports:
      - "9005:8000"
    shm_size: 256m
    environment:
      MAPBOX_ACCESS_TOKEN: "${MAPBOX_ACCESS_TOKEN:-}"

  lfm-wildfire:
    build:
      context: ./services/wildfire
      dockerfile: Dockerfile
    image: worldobserver/wildfire:latest
    container_name: lfm-wildfire
    restart: unless-stopped
    networks: [world-observer]
    ports:
      - "8085:8000"
    environment:
      LFM_BASE_DIR:    /models/base
      LFM_ADAPTER_DIR: /models/adapter
      LFM_MODEL_NAME:  lfm2.5-vl-450m-wildfire
      LFM_DEVICE:      cuda
    volumes:
      - "${WILDFIRE_MODEL_DIR:-./models/wildfire-staging}:/models:ro"
      - "${HF_CACHE_DIR:-${HOME}/.cache/huggingface}:/cache/huggingface"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # Same image as lfm-wildfire (transformers+peft serving), different
  # adapter mount + port. The wildfire-precursor LoRA expects two false
  # color frames (T-14d, T-7d) and outputs {"risk_level":"HIGH"|"LOW"};
  # see scripts/eval_wildfire_precursor_hf{,_simsat}.py.
  #
  # Base + adapter are mounted as two separate volumes (instead of one
  # parent dir like lfm-wildfire) so the base can be shared with the
  # wildfire service without duplicating it on disk.
  lfm-precursor:
    build:
      context: ./services/wildfire
      dockerfile: Dockerfile
      args:
        UPGRADE_LIBS: "1"
    image: worldobserver/wildfire:newpeft
    container_name: lfm-precursor
    restart: unless-stopped
    networks: [world-observer]
    ports:
      - "8089:8000"
    environment:
      LFM_BASE_DIR:    /models/base
      LFM_ADAPTER_DIR: /models/adapter
      LFM_MODEL_NAME:  lfm2.5-vl-450m-wildfire-precursor
      LFM_DEVICE:      cuda
    volumes:
      - "${WILDFIRE_PRECURSOR_BASE_DIR:-./models/wildfire-staging/base}:/models/base:ro"
      - "${WILDFIRE_PRECURSOR_ADAPTER_DIR:-./models/wildfire-precursor-staging/adapter}:/models/adapter:ro"
      - "${HF_CACHE_DIR:-${HOME}/.cache/huggingface}:/cache/huggingface"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  lfm2-agent:
    build:
      context: .
      dockerfile: services/agent/Dockerfile
    image: worldobserver/lfm2-agent:latest
    container_name: lfm2-agent
    restart: unless-stopped
    networks: [world-observer]
    ports:
      - "8086:8000"
    shm_size: 2g
    volumes:
      - "${LFM2_AGENT_MODEL_DIR:-./models/sft-grpo}:/model:ro"
    command:
      - "--model"
      - "/model"
      - "--served-model-name"
      - "LFM2.5-VL-450M-sft-grpo"
      - "--port"
      - "8000"
      - "--host"
      - "0.0.0.0"
      - "--gpu-memory-utilization"
      - "0.5"
      - "--max-model-len"
      - "4096"
      - "--enforce-eager"
      - "--trust-remote-code"
      - "--enable-auto-tool-choice"
      - "--tool-parser-plugin"
      - "/agent/lfm2_tool_parser.py"
      - "--tool-call-parser"
      - "lfm2_pythonic"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  app-server:
    build:
      context: .
      dockerfile: services/app/Dockerfile
    image: worldobserver/app-server:latest
    container_name: world-observer-app
    restart: unless-stopped
    networks: [world-observer]
    ports:
      - "${APP_PORT:-7860}:7860"
    environment:
      # Point to sibling containers via Docker service names
      LFM_WILDFIRE_BASE_URL:  "http://lfm-wildfire:8000/v1"
      LFM_PRECURSOR_BASE_URL: "http://lfm-precursor:8000/v1"
      LFM2_AGENT_VLLM_URL:    "http://lfm2-agent:8000/v1"
      # Use the compose-internal simsat service by default.
      # Override with SIMSAT_API_URL in .env to point at a remote instance.
      SIMSAT_API_URL:         "${SIMSAT_API_URL:-http://simsat:8000}"
      GOOGLE_API_KEY:         "${GOOGLE_API_KEY:-}"
    volumes:
      - ./data:/app/data
      - ./config:/app/config:ro
    depends_on:
      - lfm-wildfire
      - lfm-precursor
      - lfm2-agent
      - simsat
