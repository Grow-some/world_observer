# Jetson (aarch64 / JetPack 6.1+, L4T r36.4) compose override.
#
# Usage:
#   docker compose -f docker-compose.yaml -f docker-compose.jetson.yaml up -d
#
# This file overrides only the parts that differ on Jetson:
#   - lfm-wildfire / lfm-precursor: replace pytorch/pytorch x86 base with
#     nvcr.io/nvidia/l4t-pytorch (ARM CUDA, aarch64 manifest).
#   - lfm2-agent: replace vllm/vllm-openai with dustynv/vllm (ARM build from
#     jetson-containers). --gpu-memory-utilization lowered to 0.40 to leave
#     headroom for the OS in the shared LPDDR5 pool.
#
# x86_64 with discrete VRAM (e.g. RTX 4060 8 GB):
#   --gpu-memory-utilization 0.5 → ~4 GB KV-cache reserved.
#   Actual peak usage measured at ~7 GB (weights + KV cache + activations).
#   The default docker-compose.yaml value is intentional for discrete VRAM.
#
# Jetson Orin NX 16 GB (shared LPDDR5):
#   --gpu-memory-utilization 0.40 → ~6.4 GB reserved for vLLM.
#   OS + other services take ~3–4 GB of the 16 GB pool, leaving ~12 GB free.
#
# Jetson Orin NX 8 GB (shared LPDDR5):
#   Lower --gpu-memory-utilization further (0.25–0.30) to avoid OOM.
#   On discrete 8 GB VRAM (e.g. RTX 4060) the default 0.5 is fine because
#   system RAM is separate; on Jetson all consumers compete for the same pool.
#
# Set VLLM_BASE build arg to pin a specific dustynv/vllm tag:
#   VLLM_BASE=dustynv/vllm:0.6.6-r36.4.0

services:
  lfm-wildfire:
    build:
      context: ./services/wildfire
      dockerfile: Dockerfile.jetson
    image: worldobserver/wildfire:jetson

  lfm-precursor:
    build:
      context: ./services/wildfire
      dockerfile: Dockerfile.jetson
      args:
        UPGRADE_LIBS: "1"
    image: worldobserver/wildfire:jetson-newpeft

  lfm2-agent:
    build:
      context: .
      dockerfile: services/agent/Dockerfile.jetson
      args:
        VLLM_BASE: "${VLLM_BASE:-dustynv/vllm:r36.4.0}"
    image: worldobserver/lfm2-agent:jetson
    command:
      - "--model"
      - "/model"
      - "--served-model-name"
      - "LFM2.5-VL-450M-sft-grpo"
      - "--port"
      - "8000"
      - "--host"
      - "0.0.0.0"
      - "--gpu-memory-utilization"
      - "0.40"
      - "--max-model-len"
      - "4096"
      - "--enforce-eager"
      - "--trust-remote-code"
      - "--enable-auto-tool-choice"
      - "--tool-parser-plugin"
      - "/agent/lfm2_tool_parser.py"
      - "--tool-call-parser"
      - "lfm2_pythonic"
